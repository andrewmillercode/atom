# Automated releases.
#
# Merging a PR labeled `release` into main cuts a release:
#   - the merge commit on main becomes the tag + release target
#   - the version comes from [workspace.package] version in Cargo.toml
#     at that commit; tag `v<version>` must not already exist
#   - the release body comes from releases/v<version>.md at that commit;
#     if the file is missing, notes fall back to GitHub's auto-generated
#     PR list (warns in the run log)
#   - binaries are built for macOS arm64 and Linux x86_64 and attached as
#     atom-v<version>-<Darwin|Linux>-<arm64|x86_64>.tar.gz — the exact names
#     install.sh and the auto-updater (crates/atom/src/update.rs) look for
#
# Labeling a PR that is already merged triggers the same flow, so both
# label-then-merge and merge-then-label work. workflow_dispatch cuts a
# release manually from the Actions tab, from the ref you dispatch on.

name: release

on:
  pull_request:
    types: [closed, labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or ref to release (default: what you dispatch on)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.merged == true &&
        (
          github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'release') ||
          github.event.action == 'labeled' && github.event.label.name == 'release'
        )
      )
    outputs:
      version: ${{ steps.ver.outputs.version }}
      created: ${{ steps.ver.outputs.created }}
      sha: ${{ steps.ver.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.ref || github.sha }}

      - name: Read version, create tag + release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || inputs.ref || github.sha }}
        run: |
          VER="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && $1 == "version" {sub(/^version[[:space:]]*=[[:space:]]*"/, ""); sub(/".*$/, ""); print; exit}' Cargo.toml)"
          if [ -z "$VER" ]; then
            echo "::error::could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "sha=${MERGE_SHA}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v${VER}" >/dev/null 2>&1; then
            echo "tag v${VER} already exists — skipping release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOTES_FILE="releases/v${VER}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "v${VER}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$MERGE_SHA" \
              --title "atom v${VER}" \
              --notes-file "$NOTES_FILE" \
              --generate-notes
          else
            echo "::warning::${NOTES_FILE} not found at the merge commit — falling back to auto-generated release notes"
            gh release create "v${VER}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$MERGE_SHA" \
              --title "atom v${VER}" \
              --generate-notes
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

  assets:
    needs: release
    if: needs.release.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_name: Darwin
            arch: arm64
          - os: ubuntu-latest
            os_name: Linux
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --bin atom --bin atoms

      - name: Package
        run: |
          ASSET="atom-v${{ needs.release.outputs.version }}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$ASSET" -C target/release atom atoms
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.release.outputs.version }}" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
