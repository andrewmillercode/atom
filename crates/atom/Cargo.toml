[package]
name = "atom"
version.workspace = true
edition.workspace = true

[[bin]]
name = "atom"
path = "src/main.rs"

[[bin]]
name = "atoms"
path = "src/atoms.rs"

# Dev installs (`make dev`) run under the names atomdev/atomsdev. These
# are not separate cargo binaries: `make dev` copies the debug atom/atoms
# artifacts into ~/.local/bin as atomdev/atomsdev. Copies, not symlinks:
# macOS 26 names processes by the fully resolved executable path, so a
# symlinked atomsdev would display as "atoms" in ps / Activity Monitor.
# The copies self-heal (see the Makefile's .atomdev-source marker and
# find_server_binary): the client warns when cargo has built something
# newer, and the atomsdev copy is refreshed before the server spawns.
# Flavor is keyed on cfg!(debug_assertions), not the name — a dev
# install IS the debug binary — so duplicate bin targets would only
# double linking on every cargo build/test for no behavioral difference.

[dependencies]
atom-core = { workspace = true }
atom-server = { workspace = true }
atom-tui = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
