[package]
name = "atom"
version.workspace = true
edition.workspace = true

[[bin]]
name = "atom"
path = "src/main.rs"

[[bin]]
name = "atoms"
path = "src/atoms.rs"

# Dev installs (`make dev`) run under the names atomdev/atomsdev. These
# are not separate cargo binaries: `make dev` symlinks atomdev ->
# target/debug/atom and atomsdev -> target/debug/atoms. Flavor is keyed
# on cfg!(debug_assertions), not the name — a dev install IS the debug
# binary — so duplicate bin targets would only double linking on every
# cargo build/test for no behavioral difference.

[dependencies]
atom-core = { workspace = true }
atom-server = { workspace = true }
atom-tui = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
