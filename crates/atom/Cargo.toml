[package]
name = "atom"
version.workspace = true
edition.workspace = true

[[bin]]
name = "atom"
path = "src/main.rs"

# One binary for client and server: `atom` is the TUI, `atom -serve`
# (spawned by the client itself, guarded by a launch token) is the
# background server. Dev installs (`make dev`) run the same debug
# artifact as `atomdev` — client and server share the process name, so
# a single pkill atomdev shuts everything down. Flavor is keyed on
# cfg!(debug_assertions), not the name.

[dependencies]
atom-core = { workspace = true }
atom-server = { workspace = true }
atom-tui = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
