[package]
name = "atom"
version.workspace = true
edition.workspace = true

[[bin]]
name = "atom"
path = "src/main.rs"

[[bin]]
name = "atoms"
path = "src/atoms.rs"

# Dev installs (`make dev`) run under the names atomdev/atomsdev.
# These are real cargo binaries built from the same sources — not
# Makefile symlinks — so `cargo build` emits all four and `ps` shows the
# dev names with no link tricks. Flavor is keyed on
# cfg!(debug_assertions), not the name: build these in the debug profile
# only.
[[bin]]
name = "atomdev"
path = "src/main.rs"

[[bin]]
name = "atomsdev"
path = "src/atoms.rs"

[dependencies]
atom-core = { workspace = true }
atom-server = { workspace = true }
atom-tui = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
