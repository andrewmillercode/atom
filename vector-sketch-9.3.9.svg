<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="640" viewBox="0 0 1560 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#222"/></marker>
    <marker id="abu" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="agr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="aor" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/></marker>
    <marker id="api" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#db2777"/></marker>
    <marker id="alb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#93c5fd"/></marker>
    <marker id="alg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#86efac"/></marker>
  </defs>
  <rect width="1560" height="640" fill="white"/>

  <!-- ===== Panel 1: part (a) sums ===== -->
  <text x="300" y="30" font-size="18" font-weight="bold" text-anchor="middle">(a) Sums</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="160" y1="340" x2="160" y2="165"/><line x1="195" y1="445" x2="195" y2="165"/><line x1="230" y1="445" x2="230" y2="165"/><line x1="265" y1="445" x2="265" y2="165"/><line x1="335" y1="445" x2="335" y2="165"/><line x1="370" y1="445" x2="370" y2="165"/><line x1="405" y1="445" x2="405" y2="165"/><line x1="440" y1="445" x2="440" y2="165"/>
    <line x1="160" y1="445" x2="440" y2="445"/><line x1="160" y1="410" x2="440" y2="410"/><line x1="160" y1="375" x2="440" y2="375"/><line x1="160" y1="305" x2="440" y2="305"/><line x1="160" y1="270" x2="440" y2="270"/><line x1="160" y1="235" x2="440" y2="235"/><line x1="160" y1="200" x2="440" y2="200"/><line x1="160" y1="165" x2="440" y2="165"/>
  </g>
  <line x1="160" y1="340" x2="440" y2="340" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="300" y1="445" x2="300" y2="165" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="300" cy="340" r="3" fill="#222"/>
  <line x1="335" y1="270" x2="405" y2="235" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#alb)"/>
  <line x1="370" y1="305" x2="405" y2="235" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#alb)"/>
  <line x1="370" y1="305" x2="335" y2="375" stroke="#86efac" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#alg)"/>
  <line x1="300" y1="340" x2="335" y2="270" stroke="#222" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="300" y1="340" x2="370" y2="305" stroke="#222" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="300" y1="340" x2="405" y2="235" stroke="#2563eb" stroke-width="3" marker-end="url(#abu)"/>
  <line x1="300" y1="340" x2="335" y2="375" stroke="#16a34a" stroke-width="3" marker-end="url(#agr)"/>
  <text x="340" y="262" font-size="17" font-style="italic">u = &#10216;1,2&#10217;</text>
  <text x="378" y="298" font-size="17" font-style="italic">v = &#10216;2,1&#10217;</text>
  <text x="412" y="228" font-size="17" font-weight="bold" fill="#2563eb">u+v</text>
  <text x="342" y="396" font-size="17" font-weight="bold" fill="#16a34a">v&#8722;u</text>

  <!-- ===== Panel 2: part (c) multiples of v ===== -->
  <text x="730" y="30" font-size="18" font-weight="bold" text-anchor="middle">(c) Multiples of v</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="506" y1="468" x2="506" y2="212"/><line x1="538" y1="468" x2="538" y2="212"/><line x1="570" y1="468" x2="570" y2="212"/><line x1="602" y1="468" x2="602" y2="212"/><line x1="634" y1="468" x2="634" y2="212"/><line x1="666" y1="468" x2="666" y2="212"/><line x1="698" y1="468" x2="698" y2="212"/><line x1="762" y1="468" x2="762" y2="212"/><line x1="794" y1="468" x2="794" y2="212"/><line x1="826" y1="468" x2="826" y2="212"/><line x1="858" y1="468" x2="858" y2="212"/><line x1="890" y1="468" x2="890" y2="212"/><line x1="922" y1="468" x2="922" y2="212"/><line x1="954" y1="468" x2="954" y2="212"/>
    <line x1="506" y1="468" x2="954" y2="468"/><line x1="506" y1="436" x2="954" y2="436"/><line x1="506" y1="404" x2="954" y2="404"/><line x1="506" y1="372" x2="954" y2="372"/><line x1="506" y1="308" x2="954" y2="308"/><line x1="506" y1="276" x2="954" y2="276"/><line x1="506" y1="244" x2="954" y2="244"/><line x1="506" y1="212" x2="954" y2="212"/>
  </g>
  <line x1="506" y1="340" x2="954" y2="340" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="730" y1="468" x2="730" y2="212" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="730" cy="340" r="3" fill="#222"/>
  <!-- the line of all terminal points (part d) -->
  <line x1="506" y1="452" x2="954" y2="228" stroke="#d1d5db" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="730" y1="340" x2="922" y2="244" stroke="#ea580c" stroke-width="3" marker-end="url(#aor)"/>
  <line x1="730" y1="340" x2="858" y2="276" stroke="#ea580c" stroke-width="3" marker-end="url(#aor)"/>
  <line x1="730" y1="340" x2="794" y2="308" stroke="#d1d5db" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="730" y1="340" x2="666" y2="372" stroke="#db2777" stroke-width="3" marker-end="url(#api)"/>
  <line x1="730" y1="340" x2="602" y2="404" stroke="#db2777" stroke-width="3" marker-end="url(#api)"/>
  <line x1="730" y1="340" x2="538" y2="436" stroke="#db2777" stroke-width="3" marker-end="url(#api)"/>
  <text x="928" y="240" font-size="16" font-weight="bold" fill="#ea580c">3v</text>
  <text x="864" y="272" font-size="16" font-weight="bold" fill="#ea580c">2v</text>
  <text x="800" y="304" font-size="15" font-style="italic" fill="#9ca3af">v</text>
  <text x="640" y="390" font-size="16" font-weight="bold" fill="#db2777">&#8722;v</text>
  <text x="578" y="420" font-size="16" font-weight="bold" fill="#db2777">&#8722;2v</text>
  <text x="512" y="452" font-size="16" font-weight="bold" fill="#db2777">&#8722;3v</text>
  <text x="506" y="500" font-size="14" fill="#6b7280">(d) gray dashed line: tips of tv for all real t = the whole line through the origin along v</text>

  <!-- ===== Panel 3: part (e) u + t v ===== -->
  <text x="1150" y="30" font-size="18" font-weight="bold" text-anchor="middle">(e) u + t&#8901;v</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="970" y1="400" x2="970" y2="160"/><line x1="1000" y1="400" x2="1000" y2="160"/><line x1="1030" y1="400" x2="1030" y2="160"/><line x1="1060" y1="400" x2="1060" y2="160"/><line x1="1090" y1="400" x2="1090" y2="160"/><line x1="1120" y1="400" x2="1120" y2="160"/><line x1="1150" y1="400" x2="1150" y2="160"/><line x1="1180" y1="400" x2="1180" y2="160"/><line x1="1210" y1="400" x2="1210" y2="160"/><line x1="1240" y1="400" x2="1240" y2="160"/><line x1="1270" y1="400" x2="1270" y2="160"/><line x1="1300" y1="400" x2="1300" y2="160"/><line x1="1330" y1="400" x2="1330" y2="160"/><line x1="1360" y1="400" x2="1360" y2="160"/>
    <line x1="970" y1="400" x2="1360" y2="400"/><line x1="970" y1="370" x2="1360" y2="370"/><line x1="970" y1="340" x2="1360" y2="340"/><line x1="970" y1="310" x2="1360" y2="310"/><line x1="970" y1="280" x2="1360" y2="280"/><line x1="970" y1="250" x2="1360" y2="250"/><line x1="970" y1="220" x2="1360" y2="220"/><line x1="970" y1="190" x2="1360" y2="190"/><line x1="970" y1="160" x2="1360" y2="160"/>
  </g>
  <line x1="970" y1="340" x2="1360" y2="340" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="1150" y1="400" x2="1150" y2="160" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="1150" cy="340" r="3" fill="#222"/>
  <!-- reference u and v from origin -->
  <line x1="1150" y1="340" x2="1180" y2="280" stroke="#222" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="1150" y1="340" x2="1210" y2="310" stroke="#d1d5db" stroke-width="2" marker-end="url(#ab)"/>
  <!-- line of all tips (part f): through tip of u, parallel to v -->
  <line x1="940" y1="400" x2="1360" y2="190" stroke="#d1d5db" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- family u + t v -->
  <line x1="1150" y1="340" x2="1000" y2="370" stroke="#2563eb" stroke-width="3" marker-end="url(#abu)"/>
  <line x1="1150" y1="340" x2="1060" y2="340" stroke="#2563eb" stroke-width="3" marker-end="url(#abu)"/>
  <line x1="1150" y1="340" x2="1120" y2="310" stroke="#2563eb" stroke-width="3" marker-end="url(#abu)"/>
  <line x1="1150" y1="340" x2="1240" y2="250" stroke="#2563eb" stroke-width="3" marker-end="url(#abu)"/>
  <line x1="1150" y1="340" x2="1300" y2="220" stroke="#2563eb" stroke-width="3" marker-end="url(#abu)"/>
  <text x="1186" y="276" font-size="15" font-style="italic">u</text>
  <text x="1216" y="306" font-size="14" font-style="italic" fill="#9ca3af">v</text>
  <text x="1004" y="386" font-size="15" font-weight="bold" fill="#2563eb">u&#8722;3v</text>
  <text x="1064" y="332" font-size="15" font-weight="bold" fill="#2563eb">u&#8722;2v</text>
  <text x="1092" y="300" font-size="15" font-weight="bold" fill="#2563eb">u&#8722;v</text>
  <text x="1246" y="246" font-size="15" font-weight="bold" fill="#2563eb">u+v</text>
  <text x="1306" y="216" font-size="15" font-weight="bold" fill="#2563eb">u+2v</text>
  <text x="970" y="428" font-size="14" fill="#6b7280">(f) gray dashed line: tips of u+tv = line through the tip of u, parallel to v</text>

  <text x="780" y="610" font-size="15" text-anchor="middle" fill="#374151">Same picture, two lines: scaling v alone sweeps a line through the origin; adding u first shifts that whole line to pass through the tip of u.</text>
</svg>
